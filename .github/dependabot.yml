version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # These are pinned to specific Roslyn/Microsoft.CodeAnalysis versions on purpose
      # (netstandard1.1 compatibility, lightup support, and the per-C#-version test matrix),
      # so Dependabot shouldn't bump them.
      - dependency-name: "Microsoft.CodeAnalysis"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.CodeStyle"
      - dependency-name: "Microsoft.CodeAnalysis.CSharp.Workspaces"
      - dependency-name: "Microsoft.CodeAnalysis.Workspaces.MSBuild"
      # This currently causes problems if upgraded, so skip it for now.
      - dependency-name: "DotNetAnalyzers.DocumentationAnalyzers"
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
